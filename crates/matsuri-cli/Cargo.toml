# 骏大祭剧本终端前端：跑局 bin `matsuri`
#
# 复用 `umaai-cli` 的呈现件（样例面，pub 面不承诺稳定）。
[package]
name = "matsuri-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "matsuri"
path = "src/main.rs"

[[bin]]
name = "matsuri-mccli"
path = "src/mccli.rs"

[dependencies]
matsuri-core.workspace = true
umaai-core.workspace = true
umasim.workspace = true
umaai.workspace = true
umaai-cli.workspace = true
anyhow.workspace = true
rand.workspace = true
serde_json.workspace = true
serde.workspace = true
